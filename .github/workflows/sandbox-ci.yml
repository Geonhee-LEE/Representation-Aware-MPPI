# Sandbox CI — the D-016 verification gate.
#
# Runs the pure-Python eval/ suite (mppi_sandbox + metrics) on a plain
# ubuntu runner. No ROS container: ROS-dependent tests guard themselves with
# importorskip / lazy imports and simply skip here.
# This is the green/red signal the hourly auto-research executor relies on
# to prove that new controller / representation code actually drives.
#
# Split into two jobs (Q-051): the suite grew past the single job's 10-minute
# timeout, which turned every run red and — worse — MASKED a genuine test
# failure that had been red for eight runs before the timeout started killing
# the job first. `fast` gives a quick signal on the bulk of the suite; `slow`
# carries the deliberately-derailed and frozen closed-loop runs that are the
# evidence for D-029 / D-030 and cannot be shortened without weakening them.
# Both jobs are required — the marker splits WHEN tests run, never WHETHER.
#
# Deps come from `eval/requirements-ci.txt`, NOT from a bare `pip install numpy`
# (D-032). The unpinned install resolved to numpy 2.x on the runner while the
# dev box calibrated every D-029 / D-030 constant on 1.26.4, and five slow tests
# flip verdict between the two — reproduced on one box by swapping numpy alone.
# Read that file before bumping anything; the pin is a reproducibility contract.
#
# But the pin is NOT why the slow half is red (D-033). It was applied, honoured,
# and the same five tests failed anyway. The actual variable is this runner's
# SIMD dispatch: it has no AVX-512, the dev box does, and masking AVX-512 off
# there reproduces the runner's number to all 17 digits. Hence the "Fingerprint
# the runner" step below — a matching numpy version is not a matching machine,
# and reading it as one is what made the slow half look like a code regression.

name: Sandbox CI

on:
  push:
    branches: [main]
    paths: ['eval/**', '.github/workflows/sandbox-ci.yml']
  pull_request:
    branches: [main]
    paths: ['eval/**', '.github/workflows/sandbox-ci.yml']
  workflow_dispatch:

env:
  # Explicit paths: launch-file tests need a sourced ROS workspace and are
  # covered by the (currently disabled) ROS container CI instead.
  EVAL_PATHS: >-
    eval/mppi_sandbox/tests/
    eval/tests/test_path_tracking_metrics.py
    eval/tests/test_run_metrics.py

jobs:
  fast:
    name: pytest (fast)
    runs-on: ubuntu-24.04
    # 10 -> 30 (D-084). The slow job's comment below already names this exact
    # failure mode -- "how the old job got a 10-minute ceiling that silently
    # became the thing under test" -- and it was written about THIS job, then
    # applied only to that one. The ceiling was crossed on 2026-08-03T23:18Z and
    # every Sandbox CI run since was CANCELLED at the cap: 27 consecutive pushes
    # with no verdict at all. Nothing went red, because a cancelled job is not a
    # failing one; `gh pr checks` prints it as "fail" and STATE.md read it as
    # "green". Measured on this branch: last run to reach a verdict of any kind
    # under this cap took 5m55s (b1f07110, 2026-08-03T14:18Z, success); from
    # 2be88f0a (2026-08-03T23:18Z) on, every fast job is killed at 10m00s.
    # Cost is superlinear in instrument count -- the instrument tests verify by
    # spawning subprocess pytest runs -- so the ceiling must sit far above the
    # measurement, not on it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet -r eval/requirements-ci.txt

      - name: Fingerprint the runner (D-033)
        # The pin makes the numpy version reproducible; it does NOT make the
        # machine reproducible. numpy picks its SIMD kernels from the host CPU
        # at import, and AVX-512-vs-AVX2 reduction order is what actually flips
        # the five slow closed-loop verdicts -- masking AVX-512 off on the dev
        # box reproduces this runner's number to all 17 digits. GH does not
        # guarantee a CPU model, so record it on every run: without this, a
        # green and a red run look identical in the log.
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          python -c "
          import numpy
          cfg = numpy.__config__.show(mode='dicts')
          simd = cfg.get('SIMD Extensions', {})
          print('numpy      :', numpy.__version__)
          print('simd found :', simd.get('found'))
          print('blas       :', cfg.get('Build Dependencies', {}).get('blas', {}).get('name'))
          "

      - name: Run eval suite (fast half)
        run: python -m pytest -v ${{ env.EVAL_PATHS }}

      - name: Smoke-run the straight scenario end-to-end
        run: |
          python -m eval.mppi_sandbox.run eval/scenarios/cafe_straight_v0.yaml \
            --run-id ci-smoke --out-dir /tmp/runs
          python -c "
          import json
          r = json.load(open('/tmp/runs/ci-smoke.json'))
          assert r['pass'] is True, r['acceptance']
          print('smoke pass:', r['metrics'])
          "

  slow:
    name: pytest (slow closed-loop)
    runs-on: ubuntu-24.04
    # Deliberately generous. Two corrections behind this number: a suite run in
    # ONE process costs ~1.5x the sum of its per-file runs (628s of per-file
    # measurement vs >900s single-process), and the runner is slower than the
    # dev box. Setting this to the measured figure is how the old job got a
    # 10-minute ceiling that silently became the thing under test. These runs'
    # cost IS the assertion, so the ceiling must sit far above them; a breach
    # here is a real signal, not a budget nit.
    #
    # 60 -> 120 (D-085). D-084 raised the fast job 10 -> 30 and stopped there,
    # having read the streak as one ceiling crossing. Measured per JOB rather
    # than per run, there were TWO, ~10 h apart: fast crossed 10 min at
    # 2be88f0a (2026-08-03T23:18Z), and this job crossed 60 min at ed80d0bd
    # (2026-08-04T09:32Z) and has been killed at 60.2 min on all 12 runs since.
    # Both jobs are required, so raising only the fast one leaves every run
    # CANCELLED and the authority silent -- D-084's fix was half a fix, and it
    # read as a whole one because the run-level conclusion says `cancelled`
    # either way. Last verdict-reaching runs here: 20.8 / 24.9 / ~29.5 min,
    # then 57.97 min immediately before the cap started biting; the growth is
    # the instrument suite's superlinear cost, so the headroom is doubled
    # rather than trimmed to the last reading -- the same rule the paragraph
    # above states, applied to the job it was written about.
    #
    # 120 -> 360 (D-094), and this one is DERIVED rather than chosen -- see
    # eval/mppi_sandbox/declared_ceiling.py, which reads this line as the
    # authority and grades it against a measured floor.
    #
    # The floor: D-092 measured >=18 nested full-suite runs across 6 declared
    # runner classes, D-093 shipped the memo that collapses them, and what
    # survives a PERFECT collapse is 6 x 1396 s = 8376 s = 139.6 min -- already
    # 20 min above this job's old 120 ceiling, which is why every run since
    # 2026-08-04 was killed. Required = floor x 2 = 279.2 min, the doubling
    # being the rule the paragraph above states (superlinear instrument cost)
    # plus this job's own non-nested work, which nothing has measured in
    # isolation.
    #
    # Why 360 and not 280. `runway()` reports that only ONE more full-suite
    # runner class fits under the platform's own job kill: at 7 classes the
    # requirement is 325.7 min, at 8 it is 372.3 and NO declarable value works.
    # A ceiling is a kill switch, not a reservation -- it costs nothing when the
    # job finishes early -- so declaring 280 would buy one more raise cycle and
    # nothing else. Take the whole remaining runway now. The next time
    # test_declared_ceiling goes red it will read UNENFORCEABLE, which is a
    # different problem with a different fix (co-install the recorders, or cut
    # the census subject), not a fourth number bump.
    #
    # The 360 cap itself is DECLARED, NOT MEASURED here: this cycle had no
    # network access to fetch the documented limit. Declaring 360 is safe under
    # every reading of it -- equal to the default, or clamped by the platform,
    # or conservative -- which is the other reason it is the value to pick.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet -r eval/requirements-ci.txt

      - name: Fingerprint the runner (D-033)
        # The pin makes the numpy version reproducible; it does NOT make the
        # machine reproducible. numpy picks its SIMD kernels from the host CPU
        # at import, and AVX-512-vs-AVX2 reduction order is what actually flips
        # the five slow closed-loop verdicts -- masking AVX-512 off on the dev
        # box reproduces this runner's number to all 17 digits. GH does not
        # guarantee a CPU model, so record it on every run: without this, a
        # green and a red run look identical in the log.
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          python -c "
          import numpy
          cfg = numpy.__config__.show(mode='dicts')
          simd = cfg.get('SIMD Extensions', {})
          print('numpy      :', numpy.__version__)
          print('simd found :', simd.get('found'))
          print('blas       :', cfg.get('Build Dependencies', {}).get('blas', {}).get('name'))
          "

      - name: Run eval suite (slow half only)
        run: python -m pytest -v --slow -m slow ${{ env.EVAL_PATHS }}
