# Sandbox CI — the D-016 verification gate.
#
# Runs the pure-Python eval/ suite (mppi_sandbox + metrics) on a plain
# ubuntu runner. No ROS container: ROS-dependent tests guard themselves with
# importorskip / lazy imports and simply skip here.
# This is the green/red signal the hourly auto-research executor relies on
# to prove that new controller / representation code actually drives.
#
# Split into two jobs (Q-051): the suite grew past the single job's 10-minute
# timeout, which turned every run red and — worse — MASKED a genuine test
# failure that had been red for eight runs before the timeout started killing
# the job first. `fast` gives a quick signal on the bulk of the suite; `slow`
# carries the deliberately-derailed and frozen closed-loop runs that are the
# evidence for D-029 / D-030 and cannot be shortened without weakening them.
# Both jobs are required — the marker splits WHEN tests run, never WHETHER.

name: Sandbox CI

on:
  push:
    branches: [main]
    paths: ['eval/**', '.github/workflows/sandbox-ci.yml']
  pull_request:
    branches: [main]
    paths: ['eval/**', '.github/workflows/sandbox-ci.yml']
  workflow_dispatch:

env:
  # Explicit paths: launch-file tests need a sourced ROS workspace and are
  # covered by the (currently disabled) ROS container CI instead.
  EVAL_PATHS: >-
    eval/mppi_sandbox/tests/
    eval/tests/test_path_tracking_metrics.py
    eval/tests/test_run_metrics.py

jobs:
  fast:
    name: pytest (fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet numpy pyyaml pytest

      - name: Run eval suite (fast half)
        run: python -m pytest -v ${{ env.EVAL_PATHS }}

      - name: Smoke-run the straight scenario end-to-end
        run: |
          python -m eval.mppi_sandbox.run eval/scenarios/cafe_straight_v0.yaml \
            --run-id ci-smoke --out-dir /tmp/runs
          python -c "
          import json
          r = json.load(open('/tmp/runs/ci-smoke.json'))
          assert r['pass'] is True, r['acceptance']
          print('smoke pass:', r['metrics'])
          "

  slow:
    name: pytest (slow closed-loop)
    runs-on: ubuntu-24.04
    # Deliberately generous. Two corrections behind this number: a suite run in
    # ONE process costs ~1.5x the sum of its per-file runs (628s of per-file
    # measurement vs >900s single-process), and the runner is slower than the
    # dev box. Setting this to the measured figure is how the old job got a
    # 10-minute ceiling that silently became the thing under test. These runs'
    # cost IS the assertion, so the ceiling must sit far above them; a breach
    # here is a real signal, not a budget nit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet numpy pyyaml pytest

      - name: Run eval suite (slow half only)
        run: python -m pytest -v --slow -m slow ${{ env.EVAL_PATHS }}
